name = "vane-cron"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# THREE cadences, matching the three refresh modes. GitHub's own scheduler
# delivered 11% of the single 15-minute schedule it used to be asked for, which
# is why this Worker keeps the clock at all.
#
# The mode is derived from the cron expression in src/index.ts — Cloudflare tells
# the handler which trigger fired, so one Worker covers all three.
#
#   */15 * * * *  prices   one provider call; also grades predictions
#   7 */4 * * *   signals  recomputes the model
#   23 3 * * *    history  rebuilds chart series; ALSO A LICENCE OBLIGATION,
#                          because stored data must be refreshed every 24h
[triggers]
crons = ["*/15 * * * *", "7 */4 * * *", "23 3 * * *"]

[vars]
GITHUB_OWNER = "sohaibzahid197"
GITHUB_REPO = "VANE"
GITHUB_WORKFLOW = "refresh.yml"
GITHUB_REF = "main"

# Secret, set with `wrangler secret put GITHUB_TOKEN`:
#   GITHUB_TOKEN  a FINE-GRAINED token scoped to this repository only, with
#                 Actions: Read and write. Nothing else — not Contents, not
#                 Workflows. Note fine-grained tokens expire (a year at most)
#                 and the failure is silent, so diarise the renewal.
