name = "vane-entitlement"
main = "src/index.ts"
compatibility_date = "2026-09-01"
# Attach a public *.workers.dev URL.
#
# Without this the deploy still succeeds — the code uploads and shows in
# `wrangler deployments list` — but no route is bound, so the hostname does
# not resolve at all. Apple's webhooks would silently go nowhere and every
# purchase would fail to validate, with a green deploy as the only evidence.
workers_dev = true
# No per-version preview URLs.
#
# Cloudflare keeps every deployed version reachable at its own hostname. For
# most Workers that is a convenience; for the one that decides who has paid it
# is a liability, because a version with a security regression stays live at
# its own URL after the fix has shipped to the main one. There is one
# entitlement service and it is the current deployment.
preview_urls = false

[vars]
BUNDLE_ID = "com.vane.app"
FIREBASE_PROJECT_ID = "vane-crypto"
# Not a secret: this key already ships inside every copy of the app. It only
# identifies the project for the Identity Toolkit lookup that turns a caller's
# ID token into a uid. Leaving it unset makes EVERY /validate call return 401,
# which reads like an auth bug rather than the config bug it is.
FIREBASE_API_KEY = "AIzaSyDN4z8nc3gUAMSuGwEak9hV_JYK-9DsuI0"
# A Sandbox purchase is free. A production deployment that honours one gives
# the product away to anyone with a sandbox tester account. Set "Sandbox" only
# on a staging deployment.
# A sandbox purchase costs nothing, so a production deployment that honours
# one gives the product away to anyone with a tester account. Set "Sandbox"
# only while testing, and set it back the moment the test passes — which is
# what happened here.
ALLOWED_ENVIRONMENT = "Production"

# Secrets, set with `wrangler secret put NAME` and never committed:
#   APPLE_KEY_ID             the .p8 key's id (App Store Connect -> Integrations)
#   APPLE_ISSUER_ID          the issuer id on that same page
#   APPLE_PRIVATE_KEY        the .p8 contents; pipe the file, do not paste
#   FIREBASE_SERVICE_ACCOUNT the service account JSON, raw
