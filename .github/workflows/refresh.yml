name: refresh-signals

# ============================================================================
# PAUSED 2026-09-27. DO NOT RE-ENABLE WITHOUT READING THIS.
#
# This workflow publishes market data fetched from Binance. Binance's Vision
# Dataset Terms (v1.0, 26 Aug 2026) license that data under CC BY-NC-SA 4.0;
# clause 3.4 states "Commercial licensing is strictly excluded" and clause 2.4
# pulls "derivative analytical indicators" inside that scope. VANE is a paid
# subscription app, so every run of this workflow published unlicensed data to
# a commercial product's database.
#
# The replacement — a licensed CoinGecko pipeline — is on the branch
# feat/licensed-data-and-charts, awaiting review. Re-enable by merging that
# branch, NOT by uncommenting the schedule below.
#
# The Cloudflare worker `vane-cron` has been paused separately; it dispatched
# this workflow every 15 minutes and is the reason `schedule:` alone being
# unreliable did not matter.
# ============================================================================

on:
  # schedule:
    # TWO schedules, 15 minutes apart. Their fire times are DISJOINT
    # (*/30 -> :00,:30; 15,45 -> :15,:45), so neither is a standby for the
    # other's slot — together they simply run every 15 minutes.
    #
    # That is the point, and an earlier version of this comment had it wrong:
    # this is a halving of the interval, not redundancy. GitHub's cron is
    # best-effort, delaying runs under load and silently dropping them —
    # observed here, with one run landing in a three-hour window against */30
    # while the app told users "Updated 1h ago". Halving the interval halves
    # the damage of any single drop: worst case after one skipped run falls
    # from 60 minutes to 30.
    #
    # Actions minutes are free on a public repo, so the extra runs cost
    # nothing there. What they do cost is Firestore writes — see scorecard.ts.
    # DISABLED — see the banner at the top of this file.
    # - cron: '*/30 * * * *'
    # - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  # Queue, do not kill. `true` cancels the OLDER run, which is the one that
  # has already started publishing — and the only time two runs overlap is
  # when GitHub has bunched delayed runs together, which is exactly the
  # pathology this schedule exists to survive.
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The pipeline is a subdirectory of the monorepo. Without this, every step
    # runs at the repo root, where there is no package.json at all.
    defaults:
      run:
        working-directory: vane-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Without the cache, npm ci dominated the job and pushed 48 runs/day
          # past the 2,000 free Actions minutes.
          cache: 'npm'
          cache-dependency-path: vane-pipeline/package-lock.json
      # Production deps only. Typecheck and tests validate COMMITTED code, so
      # they belong on push (see ci.yml) — running them 48 times a day on an
      # unchanged tree bought nothing and cost roughly 1,400 billed minutes a
      # month against a 2,000-minute allowance.
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Refresh signals
        run: npm run refresh
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
