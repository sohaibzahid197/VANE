name: refresh-signals

on:
  schedule:
    # TWO schedules, deliberately offset.
    #
    # GitHub's cron is best-effort: it delays runs under load and silently
    # drops them entirely. Observed in practice on this repo — one scheduled
    # run landed in a three-hour window against a */30 schedule, and the app
    # told users "Updated 1h ago". Two offset schedules rarely get skipped
    # together, so this is redundancy rather than a doubling of frequency.
    # The concurrency group below collapses any overlap into one run.
    - cron: '*/30 * * * *'
    - cron: '15,45 * * * *'
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The pipeline is a subdirectory of the monorepo. Without this, every step
    # runs at the repo root, where there is no package.json at all.
    defaults:
      run:
        working-directory: vane-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Without the cache, npm ci dominated the job and pushed 48 runs/day
          # past the 2,000 free Actions minutes.
          cache: 'npm'
          cache-dependency-path: vane-pipeline/package-lock.json
      # Production deps only. Typecheck and tests validate COMMITTED code, so
      # they belong on push (see ci.yml) — running them 48 times a day on an
      # unchanged tree bought nothing and cost roughly 1,400 billed minutes a
      # month against a 2,000-minute allowance.
      - run: npm ci --omit=dev || npm install --omit=dev

      - name: Refresh signals
        run: npm run refresh
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
